# Builds the HeLx image (.helx/Dockerfile) and pushes it to containers.renci.org.
#
# This workflow belongs to the helxplatform fork, not to upstream OHIF; it is
# named with a helx- prefix and touches no other workflow so that rebasing on
# upstream stays conflict-free.
#
# Building goes through `make -C .helx build` rather than a build-push action
# so that CI and a developer's machine run byte-for-byte the same two builds.
# The cost is no cross-run layer cache: every run repeats the pnpm install.
name: HeLx-Build-Push-Image

on:
  push:
    branches:
      - master
      - develop
      - 'helx/**'
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  build-push-image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.repository == 'helxplatform/ohif-viewer'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      # The viewer's dependency tree plus its build output do not fit alongside
      # the runner image's preinstalled toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Set short git commit SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_OUTPUT

      - name: Read version from .helx/config.env
        id: version
        run: |
          VERSION=$(grep '^VERSION=' .helx/config.env | cut -d'=' -f2 | tr -d '"')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Using version: ${VERSION}"

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="containers.renci.org/${{ github.repository }}"
          VERSION="${{ steps.version.outputs.version }}"
          SHORT_SHA="${{ steps.vars.outputs.short_sha }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            TAGS="${IMAGE}:test_${PR_NUM} ${IMAGE}:test_${PR_NUM}-${SHORT_SHA}"
          else
            BRANCH="${{ github.ref_name }}"
            TAGS="${IMAGE}:${VERSION} ${IMAGE}:${VERSION}-${SHORT_SHA} ${IMAGE}:${BRANCH//\//-}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Tags: ${TAGS}"

      - name: Build image
        run: make -C .helx build

      # A build that produces an image which cannot serve itself is not a
      # success. This is the same check `make run` covers locally.
      - name: Smoke test the image
        run: |
          PREFIX=/private/ohif-viewer/ci/0123456789abcdef0123456789abcdef
          docker run -d --rm --name ohif-smoke -u 30000:1136 -p 8080:8080 \
            -e NB_PREFIX="$PREFIX" ohif-viewer
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "http://localhost:8080${PREFIX}/" && break
            sleep 2
          done
          docker logs ohif-smoke

          echo "--- the bare prefix must redirect: the readiness probe uses it"
          curl -fsS -o /dev/null -w '%{http_code}\n' "http://localhost:8080${PREFIX}"

          echo "--- index.html must carry the real prefix, not the sentinel"
          curl -fsS "http://localhost:8080${PREFIX}/" > /tmp/index.html
          grep -q "$PREFIX/" /tmp/index.html
          ! grep -q '__HELX_PUBLIC_URL__' /tmp/index.html

          echo "--- every script the page loads must resolve"
          grep -oE 'src="[^"]*\.js"' /tmp/index.html | sed 's/src="//;s/"//' | sort -u |
            while read -r u; do
              echo "  checking $u"
              curl -fsS -o /dev/null "http://localhost:8080${u}"
            done

          docker rm -f ohif-smoke

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: containers.renci.org
          username: ${{ secrets.CONTAINERHUB_USERNAME }}
          password: ${{ secrets.CONTAINERHUB_TOKEN }}
          logout: true

      - name: Tag and push
        if: github.event_name != 'pull_request'
        run: |
          for tag in ${{ steps.tags.outputs.tags }}; do
            docker tag ohif-viewer "$tag"
            docker push "$tag"
          done
